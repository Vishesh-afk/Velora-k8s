apiVersion: apps/v1
kind: Deployment
metadata:
  name: velora
  namespace: default
  labels:
    app: velora
spec:
  replicas: 2
  selector:
    matchLabels:
      app: velora
  template:
    metadata:
      labels:
        app: velora
    spec:
      containers:
        - name: velora
          image: vishesh11/velora:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
